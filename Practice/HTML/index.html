<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static HTML Docker Practice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1rem; }
    main { border: 1px solid #ccc; border-radius: 14px; padding: 2rem; }
    code { background: #f1f1f1; padding: .2rem .4rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from a container!</h1>
    <p>This is a static HTML site served by a web-server container.</p>
    <p>Docker is serving this file. No application-language runtime is needed in the browser.</p>
    <p>Practice marker: <code>HTML-STATIC-01</code></p>
  </main>
</body>
</html>
